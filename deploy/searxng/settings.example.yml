use_default_settings: true

general:
  instance_name: "MACP Search"

server:
  # Generated by deploy/bootstrap.sh into deploy/searxng/settings.yml.
  # Keep this placeholder only in the committed example.
  secret_key: "__SEARXNG_SECRET__"
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  formats:
    - html
    - json
  default_lang: "zh-CN"

outgoing:
  request_timeout: 15.0
  max_request_timeout: 20.0

valkey:
  url: "redis://macp-searxng-valkey:6379/0"

ui:
  default_locale: "zh-Hans-CN"

engines:
  - name: bing
    engine: bing
    shortcut: bi
    categories: [general]
    disabled: false
  - name: sogou
    engine: sogou
    shortcut: sg
    categories: [general]
    disabled: false
  - name: 360search
    engine: 360search
    shortcut: so
    categories: [general]
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: google
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
  - name: wikipedia
    disabled: true
  - name: baidu
    disabled: true
