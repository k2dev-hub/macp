worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    log_format macp '$remote_addr - $request_id [$time_local] "$request" $status '
                    '$body_bytes_sent $request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log macp;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream macp_api {
        server api:8000 max_fails=2 fail_timeout=10s;
        server api-2:8000 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    upstream macp_oidc {
        server oidc:9100;
        keepalive 8;
    }

    upstream macp_mcp {
        # Single replica in Phase 1: MCP sessions live in memory.
        server mcp:9400 max_fails=2 fail_timeout=10s;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        # Plain HTTP is read-only so old bookmarks keep working.  Every write
        # must use the TLS listener on 9443.
        location /oidc/ {
            return 308 https://$host:9443$request_uri;
        }

        location / {
            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                return 426;
            }
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://macp_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
        }

        location = /v1/events/stream {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 426;
            }
            proxy_pass http://macp_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/macp.crt;
        ssl_certificate_key /etc/nginx/tls/macp.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 2m;
        limit_conn conn 40;

        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;

        location /oidc/ {
            proxy_pass http://macp_oidc/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 30s;
        }

        location = /v1/events/stream {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://macp_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # MCP gateway (Streamable HTTP).  Only on the TLS listener; the plain
        # :80 read-only entry must not expose it.
        location /mcp {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://macp_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Mcp-Session-Id $http_mcp_session_id;
            proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 64m;
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://macp_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            # A kvm-* execution profile boots a VM per gate call, which can take
            # 60-120s; the default 60s produced 504s while the job was still
            # running.  Long-running LLM agents also use this path.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
