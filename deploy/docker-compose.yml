name: macp

x-agent-base: &agent-base
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment:
    MACP_BASE: http://api:8000
    MACP_WRITE_TOKEN_FILE: /run/secrets/macp_write_token
  volumes:
    - ./secrets/write_token:/run/secrets/macp_write_token:ro
  depends_on:
    api:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import os,time,sys; p=os.getenv('MACP_HEALTH_FILE','/tmp/macp-agent-health'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<120 else 1)",
      ]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 60s
  networks: [macp]
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: macp-db
    environment:
      POSTGRES_USER: macp
      POSTGRES_DB: macp
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - macp-pgdata:/var/lib/postgresql/data
      - ./init/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macp -d macp"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [macp]
    restart: unless-stopped

  db-standby:
    image: postgres:16-alpine
    container_name: macp-db-standby
    hostname: macp-db-standby
    # Loopback-only publish: the cross-machine standby on .11 reaches the primary
    # through an SSH tunnel, so PostgreSQL is never exposed to the LAN.
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - macp-pgdata-standby:/var/lib/postgresql/data
      - ./standby-entrypoint.sh:/standby-entrypoint.sh:ro
      - "${MACP_WAL_ARCHIVE_DIR:-./wal-archive}:/var/lib/postgresql/wal-archive"
    entrypoint: ["/bin/bash", "/standby-entrypoint.sh"]
    # Whichever node is primary must archive WAL, otherwise the nightly dump is
    # the only recovery point (RPO = 24h).  Per-node subdirectory keyed by the
    # container name avoids segment collisions after a failover.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - "archive_command=test ! -f /var/lib/postgresql/wal-archive/$$(hostname)/%f && mkdir -p /var/lib/postgresql/wal-archive/$$(hostname) && cp %p /var/lib/postgresql/wal-archive/$$(hostname)/%f"
    # No depends_on here on purpose: `db` is a *cold* copy that must stay stopped
    # (restart=no).  A compose dependency starts it as a second primary whenever
    # this service is recreated 闂?that happened on 2026-11-14.
    networks: [macp]
    restart: unless-stopped


  db-standby-2:
    image: postgres:16-alpine
    container_name: macp-db-standby-2
    hostname: macp-db-standby-2
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_HOST_AUTH_METHOD: trust
      PRIMARY_HOST: db-standby
    volumes:
      - macp-pgdata-standby2:/var/lib/postgresql/data
      - ./standby-entrypoint.sh:/standby-entrypoint.sh:ro
      - "${MACP_WAL_ARCHIVE_DIR:-./wal-archive}:/var/lib/postgresql/wal-archive"
    entrypoint: ["/bin/bash", "/standby-entrypoint.sh"]
    # Same archive settings as db-standby: after a failover this node becomes the
    # primary and must continue archiving WAL.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - "archive_command=test ! -f /var/lib/postgresql/wal-archive/$$(hostname)/%f && mkdir -p /var/lib/postgresql/wal-archive/$$(hostname) && cp %p /var/lib/postgresql/wal-archive/$$(hostname)/%f"
    depends_on:
      db-standby:
        condition: service_started
    networks: [macp]
    restart: unless-stopped

  signer:
    # The ONLY container with agent private keys.  The API holds public keys and
    # requests signatures over the compose network with a bearer token.
    image: macp-api
    container_name: macp-signer
    command: ["uvicorn", "signer.app:app", "--host", "0.0.0.0", "--port", "9300"]
    environment:
      MACP_SIGNER_KEYS_DIR: /keys
      MACP_SIGNER_TOKEN_FILE: /run/secrets/signer_token
    volumes:
      - ./agent_keys:/keys:ro
      - ./secrets/signer_token:/run/secrets/signer_token:ro
    expose:
      - "9300"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9300/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [macp]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: macp-api
    environment:
      DATABASE_URL: postgresql://macp@${MACP_DB_HOST:-db}:${MACP_DB_PORT:-5432}/macp
      MACP_DEMO: "1"
      MACP_DEMO_SEED_TASKS: "0"
      MACP_WRITE_TOKEN_FILE: /run/secrets/macp_write_token
      MACP_WORKSPACE_ROOT: /app/workspace
      MACP_VERSION: "0.2.0"
      MACP_BUILD: ${MACP_BUILD:-local}
      # Public issuer comes from deployment.public_url via deploy/.env.
      OIDC_ISSUER: ${MACP_OIDC_ISSUER:-https://localhost:9443/oidc}
      OIDC_CLIENT_ID: macp
      OIDC_INTERNAL_URL: http://oidc:9100
      OIDC_JWKS_URL: http://oidc:9100/jwks
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      MACP_RUNNER_URL: http://runner:9200
      MACP_RUNNER_TOKEN_FILE: /run/secrets/runner_token
      SEARXNG_URL: http://searxng:8080/search
      MACP_AGENT_KEYS_DIR: /app/agent_pubkeys
      MACP_SIGNER_URL: http://signer:9300
      MACP_SIGNER_TOKEN_FILE: /run/secrets/signer_token
      # Build node address from [kvm].node_url via deploy/.env; empty disables VM profiles.
      MACP_KVM_NODE_URL: ${MACP_KVM_NODE_URL:-}
      MACP_KVM_NODE_TOKEN_FILE: /run/secrets/kvm_node_token
      MACP_WAL_ARCHIVE_DIR: /wal-archive
      MACP_LLM_MASTER_KEY_FILE: /run/secrets/llm_master_key
      LLM_PRICE_INPUT_PER_1M: ${LLM_PRICE_INPUT_PER_1M:-2}
      LLM_PRICE_OUTPUT_PER_1M: ${LLM_PRICE_OUTPUT_PER_1M:-8}
      LLM_PRICE_CACHE_HIT_PER_1M: ${LLM_PRICE_CACHE_HIT_PER_1M:-0.04}
    volumes:
      - ./secrets/write_token:/run/secrets/macp_write_token:ro
      - ./secrets/oidc_client_secret:/run/secrets/oidc_client_secret:ro
      - ./secrets/runner_token:/run/secrets/runner_token:ro
      - ./agent_pubkeys:/app/agent_pubkeys:ro
      - ./secrets/signer_token:/run/secrets/signer_token:ro
      - ./secrets/kvm_node_token:/run/secrets/kvm_node_token:ro
      - /opt/macp/wal-archive:/wal-archive:ro
      - ./secrets/llm_master_key:/run/secrets/llm_master_key:ro
      - macp-workspaces:/app/workspace
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [macp, runner-net]
    restart: unless-stopped



  api-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: macp-api-2
    environment:
      DATABASE_URL: postgresql://macp@${MACP_DB_HOST:-db}:${MACP_DB_PORT:-5432}/macp
      MACP_DEMO: "1"
      MACP_DEMO_SEED_TASKS: "0"
      MACP_WRITE_TOKEN_FILE: /run/secrets/macp_write_token
      MACP_WORKSPACE_ROOT: /app/workspace
      MACP_VERSION: "0.2.0"
      MACP_BUILD: ${MACP_BUILD:-local}
      # Public issuer comes from deployment.public_url via deploy/.env.
      OIDC_ISSUER: ${MACP_OIDC_ISSUER:-https://localhost:9443/oidc}
      OIDC_CLIENT_ID: macp
      OIDC_INTERNAL_URL: http://oidc:9100
      OIDC_JWKS_URL: http://oidc:9100/jwks
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      MACP_RUNNER_URL: http://runner:9200
      MACP_RUNNER_TOKEN_FILE: /run/secrets/runner_token
      SEARXNG_URL: http://searxng:8080/search
      MACP_AGENT_KEYS_DIR: /app/agent_pubkeys
      MACP_SIGNER_URL: http://signer:9300
      MACP_SIGNER_TOKEN_FILE: /run/secrets/signer_token
      # Build node address from [kvm].node_url via deploy/.env; empty disables VM profiles.
      MACP_KVM_NODE_URL: ${MACP_KVM_NODE_URL:-}
      MACP_KVM_NODE_TOKEN_FILE: /run/secrets/kvm_node_token
      MACP_WAL_ARCHIVE_DIR: /wal-archive
      MACP_LLM_MASTER_KEY_FILE: /run/secrets/llm_master_key
      LLM_PRICE_INPUT_PER_1M: ${LLM_PRICE_INPUT_PER_1M:-2}
      LLM_PRICE_OUTPUT_PER_1M: ${LLM_PRICE_OUTPUT_PER_1M:-8}
      LLM_PRICE_CACHE_HIT_PER_1M: ${LLM_PRICE_CACHE_HIT_PER_1M:-0.04}
    volumes:
      - ./secrets/write_token:/run/secrets/macp_write_token:ro
      - ./secrets/oidc_client_secret:/run/secrets/oidc_client_secret:ro
      - ./secrets/runner_token:/run/secrets/runner_token:ro
      - ./agent_pubkeys:/app/agent_pubkeys:ro
      - ./secrets/signer_token:/run/secrets/signer_token:ro
      - ./secrets/kvm_node_token:/run/secrets/kvm_node_token:ro
      - /opt/macp/wal-archive:/wal-archive:ro
      - ./secrets/llm_master_key:/run/secrets/llm_master_key:ro
      - macp-workspaces:/app/workspace
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [macp, runner-net]
    restart: unless-stopped



  searxng:
    image: searxng/searxng:latest
    container_name: macp-searxng
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      SEARXNG_BASE_URL: http://macp-searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - macp-searxng-cache:/var/cache/searxng
    depends_on:
      searxng-valkey:
        condition: service_started
    networks: [macp]
    restart: unless-stopped

  searxng-valkey:
    image: valkey/valkey:9-alpine
    container_name: macp-searxng-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks: [macp]
    restart: unless-stopped

  runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: macp-runner
    command: ["uvicorn", "server.runner:app", "--host", "0.0.0.0", "--port", "9200"]
    environment:
      MACP_WORKSPACE_ROOT: /app/workspace
      MACP_RUNNER_TOKEN_FILE: /run/secrets/runner_token
      MACP_RUNNER_BWRAP: "1"
    volumes:
      - ./secrets/runner_token:/run/secrets/runner_token:ro
      - macp-workspaces:/app/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN]
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    pids_limit: 1024
    mem_limit: 2g
    cpus: 1.5
    networks: [runner-net]
    restart: unless-stopped

  oidc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: macp-oidc
    command: ["uvicorn", "server.oidc_provider:app", "--host", "0.0.0.0", "--port", "9100"]
    environment:
      # Public issuer comes from deployment.public_url via deploy/.env.
      OIDC_ISSUER: ${MACP_OIDC_ISSUER:-https://localhost:9443/oidc}
      OIDC_CLIENT_ID: macp
      OIDC_KEY_FILE: /run/secrets/oidc_signing_key
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      OIDC_ADMIN_PASSWORD_FILE: /run/secrets/oidc_admin_password
      OIDC_REDIRECT_URIS: ${MACP_OIDC_REDIRECT_URIS:-http://localhost:5443/,http://localhost:5173/}
    volumes:
      - ./secrets/oidc_signing_key.pem:/run/secrets/oidc_signing_key:ro
      - ./secrets/oidc_client_secret:/run/secrets/oidc_client_secret:ro
      - ./secrets/oidc_admin_password:/run/secrets/oidc_admin_password:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [macp]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: macp-nginx
    ports:
      # Address/port come from config/macp.toml via deploy/.env
      # (render with: python3 deploy/render_env.py).  Defaults to loopback.
      - "${MACP_PUBLISH_ADDRESS:-127.0.0.1}:${MACP_HTTP_PORT:-8088}:80"
      - "${MACP_PUBLISH_ADDRESS:-127.0.0.1}:${MACP_PUBLISH_PORT:-9443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy
      oidc:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/v1/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [macp]
    restart: unless-stopped

  observer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: macp-observer
    command: ["python", "-m", "server.observer"]
    environment:
      DATABASE_URL: postgresql://macp@${MACP_DB_HOST:-db}:${MACP_DB_PORT:-5432}/macp
      MACP_OBSERVER_INTERVAL: "30"
      MACP_DAILY_COST_ALERT: ${MACP_DAILY_COST_ALERT:-5.0}
      MACP_ALERT_WEBHOOK: ${MACP_ALERT_WEBHOOK:-}
    depends_on:
      api:
        condition: service_healthy
    networks: [macp]
    restart: unless-stopped

  simulator:
    <<: *agent-base
    container_name: macp-simulator
    command: ["python", "-m", "server.simulator"]
    environment:
      DATABASE_URL: postgresql://macp@${MACP_DB_HOST:-db}:${MACP_DB_PORT:-5432}/macp
      MACP_BASE: http://api:8000
      MACP_WRITE_TOKEN_FILE: /run/secrets/macp_write_token
    profiles: ["simulator"]
    healthcheck:
      disable: true

  scheduler:
    <<: *agent-base
    container_name: macp-scheduler
    command: ["python", "-m", "agents.scheduler_loop"]
    environment:
      MACP_BASE: http://api:8000
      MACP_WRITE_TOKEN_FILE: /run/secrets/macp_write_token
      MACP_WORKERS: worker-e,worker-f,worker-g,worker-llm
      MACP_SCHEDULER_CREATE: "0"
      MACP_SCHEDULER_MAX_HISTORY: "750"
      MACP_SCHEDULER_CREATE_INTERVAL: "30"

  coordinator:
    <<: *agent-base
    container_name: macp-coordinator
    command: ["python", "-m", "agents.coordinator_loop"]
    environment:
      MACP_BASE: http://api:8000
      MACP_WRITE_TOKEN_FILE: /run/secrets/macp_write_token

  mock-openai:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: macp-mock-openai
    command: ["uvicorn", "agents.mock_openai:app", "--host", "0.0.0.0", "--port", "9000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/v1/models', timeout=3)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [macp]
    restart: unless-stopped

  worker-llm:
    <<: *agent-base
    container_name: macp-worker-llm
    command: ["python", "-m", "agents.llm_runtime"]
    environment:
      MACP_BASE: http://api:8000
      MACP_WRITE_TOKEN_FILE: /run/secrets/macp_write_token
      LLM_BASE_URL: http://mock-openai:9000/v1
      LLM_API_KEY: mock-key
      LLM_MODEL: mock-tool-model
    depends_on:
      api:
        condition: service_healthy
      mock-openai:
        condition: service_healthy

  worker-deepseek:
    <<: *agent-base
    container_name: macp-worker-deepseek
    command: ["python", "-m", "agents.llm_runtime"]
    environment:
      MACP_WORKER: worker-deepseek
      MACP_BASE: http://api:8000
      MACP_WRITE_TOKEN_FILE: /run/secrets/macp_write_token
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-flash
      # Operator-configured provider prices; when set, the cost budget is enforced
      # both locally and by the API.  Defaults are DeepSeek flash peak list prices
      # in CNY per 1M tokens; override in deploy/.env if your price sheet differs.
      LLM_PRICE_INPUT_PER_1M: ${LLM_PRICE_INPUT_PER_1M:-2}
      LLM_PRICE_OUTPUT_PER_1M: ${LLM_PRICE_OUTPUT_PER_1M:-8}
      LLM_PRICE_CACHE_HIT_PER_1M: ${LLM_PRICE_CACHE_HIT_PER_1M:-0.04}
      LLM_CONFIG_FROM_API: "1"
      LLM_API_KEY_FILE: /run/secrets/deepseek_api_key
    volumes:
      - ./secrets/write_token:/run/secrets/macp_write_token:ro
      - ./secrets/deepseek_api_key:/run/secrets/deepseek_api_key:ro

  merge-worker:
    <<: *agent-base
    container_name: macp-merge-worker
    command: ["python", "-m", "agents.merge_loop"]
    environment:
      MACP_BASE: http://api:8000
      MACP_WRITE_TOKEN_FILE: /run/secrets/macp_write_token
      MACP_MERGE_PREFIXES: ${MACP_MERGE_PREFIXES:-}

  worker-e:
    <<: *agent-base
    container_name: macp-worker-e
    command: ["python", "-m", "agents.worker_loop", "worker-e"]

  worker-f:
    <<: *agent-base
    container_name: macp-worker-f
    command: ["python", "-m", "agents.worker_loop", "worker-f"]

  worker-g:
    <<: *agent-base
    container_name: macp-worker-g
    command: ["python", "-m", "agents.worker_loop", "worker-g"]

  # MCP gateway (Phase 1, read-only).  Adapter only: every tool call is forwarded
  # to /v1/tools/{name}/invoke with the caller's own token.
  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Same image as the API: the gateway imports tool_registry for the schemas.
    image: macp-api
    container_name: macp-mcp
    command: ["uvicorn", "server.mcp_api:app", "--host", "0.0.0.0", "--port", "9400"]
    environment:
      MACP_INTERNAL_BASE: http://api:8000
      MACP_MCP_PROJECT: demo
      MACP_MCP_MAX_SESSIONS: "200"
      MACP_MCP_SESSION_TTL_SECONDS: "14400"
      MACP_MCP_RATE_LIMIT: "60"
      MACP_MCP_MAX_OUTPUT_CHARS: "20000"
    expose: ["9400"]
    depends_on:
      api:
        condition: service_healthy
    networks: [macp]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9400/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  macp-pgdata:
    name: macp-pgdata
  macp-pgdata-standby:
    name: macp-pgdata-standby
  macp-pgdata-standby2:
    name: macp-pgdata-standby2
  macp-searxng-cache:
    name: macp-searxng-cache
  macp-workspaces:
    name: macp-workspaces

networks:
  macp:
    name: macp-net
    # Fixed subnet so a deployment can reach host-run services (e.g. an SSH
    # tunnel to a database on another machine) through a stable gateway address.
    ipam:
      config:
        - subnet: 172.28.0.0/16
  runner-net:
    name: macp-runner-net
    internal: true
