name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest

      - name: Configuration compiles and loads
        run: |
          python -c "import tomllib, pathlib; tomllib.loads(pathlib.Path('config/macp.example.toml').read_text())"
          python -m server.settings show >/dev/null
          python -m server.settings json >/dev/null

      - name: Python syntax
        run: |
          python -m compileall -q server agents bridge deploy/verify tests

      - name: Shell syntax
        run: |
          fail=0
          for script in $(git ls-files '*.sh'); do
            bash -n "$script" || { echo "syntax error: $script"; fail=1; }
          done
          exit $fail

      - name: Unit tests
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            python -m pytest -q tests
          else
            echo "no unit tests yet"
          fi

      - name: Frontend build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
